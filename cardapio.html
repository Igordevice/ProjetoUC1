<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="Css/cardapio.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- ==================== MENU SECTION ==================== -->
<section class="Cardapio">
  <div class="container">
  <h2 class="title">Nosso cardápio</h2>
  </div>
</section>
  <br>
<div class="filtros">
  <button class="filtro-btn active" data-filtro="todos">Ver Tudo</button>
  <button class="filtro-btn" data-filtro="celiacos"> Celíacos</button>
  <button class="filtro-btn" data-filtro="lactose"> Sem Lactose</button>
  <button class="filtro-btn" data-filtro="veganos"> Veganos</button>
</div>

<div class="cardapio-grid">
  <div class="card-produto" data-categorias="celiacos veganos">
    <img src="Img/Img/Pãointegral.jpg" alt="Pãointegral">
    <h3>Pão integral sem glutén</h3>
  </div>

  <div class="cardapio-grid">
  <div class="card-produto" data-categorias="celiacos veganos">
    <img src="Img/Img/PãodeQueijo.jpg" alt="Pãointegral">
    <span class="tag">Sem Glúten</span> 
    <h3>Pão de queijo mineiro</h3>
  </div>

  <div class="cardapio-grid">
  <div class="card-produto" data-categorias="celiacos veganos">
    <img src="Img/Img/SanduicheN.jpg" alt="Sanduiche Natural">
    <span class="tag">Sem Glúten</span> 
    <h3>Sanduiche integral</h3>
  </div>



  <div class="card-produto" data-categorias="lactose veganos">
    <img src="cappuccino.jpg" alt="Cappuccino de Aveia">
    <span class="tag">Sem Lactose</span>
    <span class="tag">Vegano</span>
    <h3>Cappuccino de Aveia</h3>
  </div>

  <div class="card-produto" data-categorias="celiacos">
    <img src="pao-queijo.jpg" alt="Pão de Queijo Sem Glúten">
    <span class="tag">Sem Glúten</span>
    <h3>Pão de Queijo Sem Glúten</h3>
  </div>
</div>

<script src="script.js"></script>
o
</body>
</html>
